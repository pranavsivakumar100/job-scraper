app = "tech-job-scraper-api"
primary_region = "sjc"

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[env]
  DATABASE_URL = "sqlite:///tmp/jobs.db"
  PYTHONPATH = "."
  PORT = "8000"

[processes]
  app = "uvicorn api.main:app --host 0.0.0.0 --port 8000" 