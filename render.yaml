services:
  - type: web
    name: tech-job-scraper-api
    runtime: python
    env: python
    plan: free
    region: oregon
    branch: main
    buildCommand: ./build.sh
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: PIP_NO_CACHE_DIR
        value: "1"
      - key: DATABASE_URL
        value: sqlite:///tmp/jobs.db
      - key: PYTHONPATH
        value: "."
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000" 