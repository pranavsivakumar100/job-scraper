name: 🚀 Deploy API with Fresh Data

on:
  # Trigger after successful scraping
  workflow_run:
    workflows: ["🕐 Automated Job Scraping"]
    types:
      - completed
  
  # Manual trigger
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'

jobs:
  deploy-to-render:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4
      
    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: 📊 Download latest scraped data
      uses: actions/download-artifact@v3
      with:
        name: scraped-jobs-${{ github.event.workflow_run.run_number }}
        path: ./data
      continue-on-error: true
      
    - name: 🔄 Update Render deployment
      env:
        RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      run: |
        echo "🚀 Triggering Render deployment..."
        if [ -n "$RENDER_API_KEY" ] && [ -n "$RENDER_SERVICE_ID" ]; then
          curl -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys"
          echo "✅ Render deployment triggered"
        else
          echo "⚠️ Render secrets not configured. Skipping deployment."
        fi
        
  update-vercel-data:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4
      
    - name: 📊 Download latest scraped data
      uses: actions/download-artifact@v3
      with:
        name: scraped-jobs-${{ github.event.workflow_run.run_number }}
        path: ./data
      continue-on-error: true
      
    - name: 🔄 Update Vercel API with real data
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      run: |
        echo "🔄 Updating Vercel API with fresh data..."
        if [ -f "./data/scraped_jobs.json" ]; then
          echo "📊 Found scraped data file"
          # Here you could update your Vercel deployment with real data
          # For now, we'll just show the data is available
          jobs_count=$(jq length ./data/scraped_jobs.json)
          echo "✅ Ready to deploy $jobs_count jobs to Vercel"
        else
          echo "⚠️ No scraped data found, using existing data"
        fi 